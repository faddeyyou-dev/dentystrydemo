<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f8f8f5">
<title>Dr.Yun — чат-виджет</title>
<style>
:root {
  color-scheme: light;
  --ink: #25322b;
  --ink-soft: #46554c;
  --muted: #737f77;
  --muted-light: #a0aaa2;
  --evergreen: #174b3b;
  --evergreen-deep: #103a2e;
  --sage: #e9eee8;
  --sage-line: #dbe2da;
  --ivory: #fcfbf8;
  --white: #fff;
  --shadow-panel: 0 24px 72px rgba(24, 42, 32, .17), 0 3px 12px rgba(24, 42, 32, .06);
}
* { box-sizing: border-box; }
html, body { min-width: 320px; min-height: 100%; margin: 0; }
body {
  background: transparent;
  color: var(--ink);
  font-family: Inter, "Segoe UI", Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
button, input { font: inherit; }
button { -webkit-tap-highlight-color: transparent; }
#dr-yun-chat {
  position: fixed;
  right: 26px;
  bottom: max(24px, env(safe-area-inset-bottom));
  z-index: 999999;
  color: var(--ink);
  font-size: 14px;
  line-height: 1.45;
}
.chat-panel {
  position: absolute;
  right: 0;
  bottom: 82px;
  display: flex;
  width: min(402px, calc(100vw - 32px));
  height: min(650px, calc(100dvh - 126px));
  min-height: min(430px, calc(100dvh - 126px));
  flex-direction: column;
  overflow: hidden;
  border: 1px solid rgba(226, 231, 225, .95);
  border-radius: 24px;
  background: var(--ivory);
  box-shadow: var(--shadow-panel);
  opacity: 0;
  visibility: hidden;
  transform: translateY(12px) scale(.985);
  transform-origin: bottom right;
  transition: opacity .22s ease, transform .28s cubic-bezier(.2, .75, .25, 1), visibility .22s;
}
.chat-panel.open { opacity: 1; visibility: visible; transform: translateY(0) scale(1); }
.chat-head {
  position: relative;
  display: flex;
  min-height: 104px;
  flex: none;
  align-items: center;
  gap: 13px;
  overflow: hidden;
  padding: 18px 19px;
  color: #fff;
  background: var(--evergreen);
}
.chat-head::after {
  position: absolute;
  top: -101px;
  right: -62px;
  width: 220px;
  height: 220px;
  border: 1px solid rgba(255, 255, 255, .105);
  border-radius: 50%;
  box-shadow: 0 0 0 18px rgba(255, 255, 255, .025), 0 0 0 40px rgba(255, 255, 255, .018);
  content: "";
  pointer-events: none;
}
.brand-icon {
  display: grid;
  width: 48px;
  height: 48px;
  flex: none;
  place-items: center;
  border: 1px solid rgba(255, 255, 255, .24);
  border-radius: 15px;
  color: #f7faf6;
  background: rgba(255, 255, 255, .07);
}
.brand-icon svg { width: 27px; height: 27px; }
.brand-copy { min-width: 0; position: relative; z-index: 1; }
.eyebrow {
  display: flex;
  align-items: center;
  gap: 6px;
  margin: 0 0 4px;
  color: rgba(245, 249, 245, .77);
  font-size: 9px;
  font-weight: 700;
  letter-spacing: .13em;
  line-height: 1.3;
  text-transform: uppercase;
}
.status-dot {
  width: 6px;
  height: 6px;
  flex: none;
  border-radius: 50%;
  background: #c0d2bd;
  box-shadow: 0 0 0 3px rgba(207, 223, 202, .10);
}
.status-separator { opacity: .45; }
.brand-title {
  margin: 0;
  color: #fff;
  font-family: Georgia, "Times New Roman", serif;
  font-size: 20px;
  font-weight: 400;
  letter-spacing: -.018em;
  line-height: 1.16;
}
.brand-subtitle { margin: 4px 0 0; color: rgba(245, 249, 245, .72); font-size: 11px; line-height: 1.35; }
.close {
  position: relative;
  z-index: 2;
  display: grid;
  width: 38px;
  height: 38px;
  flex: none;
  margin-left: auto;
  place-items: center;
  border: 1px solid rgba(255, 255, 255, .19);
  border-radius: 12px;
  color: #fff;
  background: rgba(255, 255, 255, .055);
  cursor: pointer;
  transition: background .18s ease, border-color .18s ease, transform .18s ease;
}
.close:hover { transform: rotate(4deg); border-color: rgba(255, 255, 255, .34); background: rgba(255, 255, 255, .12); }
.close svg { width: 16px; height: 16px; }
.messages {
  display: flex;
  min-height: 0;
  flex: 1;
  flex-direction: column;
  overflow: auto;
  padding: 19px 18px 10px;
  background: var(--ivory);
  overscroll-behavior: contain;
  scroll-behavior: smooth;
  scrollbar-color: #c7d0c7 transparent;
  scrollbar-width: thin;
}
.messages::-webkit-scrollbar { width: 6px; }
.messages::-webkit-scrollbar-thumb { border-radius: 8px; background: #c7d0c7; }
.messages::-webkit-scrollbar-track { background: transparent; }
.day {
  width: max-content;
  margin: 0 auto 19px;
  padding: 5px 10px;
  border: 1px solid #e9ece7;
  border-radius: 999px;
  color: #7d8980;
  background: rgba(255, 255, 255, .72);
  font-size: 9px;
  font-weight: 650;
  letter-spacing: .075em;
  text-transform: uppercase;
}
.message { display: flex; align-items: flex-end; gap: 8px; margin-bottom: 14px; animation: message-in .22s ease both; }
@keyframes message-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
.message.user { justify-content: flex-end; }
.tooth {
  display: grid;
  width: 27px;
  height: 27px;
  flex: none;
  place-items: center;
  border: 1px solid #e1e7df;
  border-radius: 10px;
  color: var(--evergreen);
  background: #f1f4ef;
}
.tooth svg { width: 15px; height: 15px; }
.stack { display: flex; max-width: 84%; flex-direction: column; gap: 4px; }
.bubble {
  padding: 11px 13px;
  border: 1px solid #e7eae5;
  border-radius: 16px 16px 16px 5px;
  color: #344239;
  background: #fff;
  box-shadow: 0 2px 5px rgba(31, 48, 37, .025);
  font-size: 13px;
  line-height: 1.52;
  overflow-wrap: anywhere;
  white-space: pre-wrap;
}
.user .bubble {
  border-color: var(--evergreen);
  border-radius: 16px 16px 5px 16px;
  color: #fff;
  background: var(--evergreen);
  box-shadow: 0 3px 9px rgba(23, 75, 59, .13);
}
.stamp { padding: 0 3px; color: var(--muted); font-size: 10px; line-height: 1.2; }
.user .stamp { text-align: right; }
.suggestion-area {
  flex: none;
  padding: 0 18px 14px;
  background: var(--ivory);
}
.suggestions-toggle {
  display: flex;
  width: 100%;
  min-height: 32px;
  align-items: center;
  justify-content: space-between;
  margin: 0 0 5px;
  padding: 2px 2px;
  border: 0;
  border-radius: 8px;
  color: var(--muted);
  background: transparent;
  cursor: pointer;
  font-size: 11px;
  font-weight: 600;
  text-align: left;
  transition: color .18s ease, background .18s ease;
}
.suggestions-toggle:hover { color: var(--ink); background: rgba(23, 75, 59, .035); }
.suggestions-chevron { color: var(--evergreen); font-size: 16px; line-height: 1; transition: transform .18s ease; }
.suggestions-toggle[aria-expanded="true"] .suggestions-chevron { transform: rotate(180deg); }
.suggestions {
  display: grid;
  grid-template-columns: 1fr;
  gap: 8px;
  margin: 0;
  animation: message-in .28s .04s ease both;
}
.suggestions[hidden] { display: none; }
.suggestions button {
  display: flex;
  min-width: 0;
  min-height: 42px;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 9px 11px;
  border: 1px solid var(--sage-line);
  border-radius: 12px;
  color: var(--ink-soft);
  background: #fff;
  cursor: pointer;
  font-size: 11px;
  font-weight: 600;
  line-height: 1.25;
  text-align: left;
  transition: border-color .18s ease, background .18s ease, transform .18s ease;
}
.suggestions button:first-child { border-color: var(--evergreen); color: #fff; background: var(--evergreen); }
.suggestions button:hover { transform: translateY(-1px); border-color: #9cad9e; background: #f6f8f5; }
.suggestions button:first-child:hover { border-color: var(--evergreen-deep); background: var(--evergreen-deep); }
.suggestions button span { color: inherit; opacity: .68; font-size: 15px; }
.typing { display: flex; align-items: flex-end; gap: 8px; margin: 1px 0 13px; animation: message-in .18s ease both; }
.dots {
  display: flex;
  height: 34px;
  align-items: center;
  gap: 4px;
  padding: 0 12px;
  border: 1px solid #e7eae5;
  border-radius: 15px 15px 15px 5px;
  background: #fff;
}
.dots i { width: 5px; height: 5px; border-radius: 50%; background: #809187; animation: dot-pulse 1.05s ease-in-out infinite; }
.dots i:nth-child(2) { animation-delay: .14s; }
.dots i:nth-child(3) { animation-delay: .28s; }
@keyframes dot-pulse { 0%, 60%, 100% { opacity: .46; transform: translateY(0); } 30% { opacity: 1; transform: translateY(-3px); } }
.composer { flex: none; padding: 11px 16px 13px; border-top: 1px solid #e8ebe6; background: #fbfaf7; }
.input-wrap {
  display: flex;
  height: 50px;
  align-items: center;
  gap: 8px;
  padding: 4px 5px 4px 14px;
  border: 1px solid #dfe5de;
  border-radius: 14px;
  background: #fff;
  transition: border-color .18s ease, box-shadow .18s ease;
}
.input-wrap:focus-within { border-color: #9ca79f; box-shadow: 0 0 0 2px rgba(37, 50, 43, .06); }
.chat-input { width: 100%; min-width: 0; border: 0; outline: 0; color: var(--ink); background: transparent; font-size: 13px; }
.chat-input:focus-visible { outline: none; }
.chat-input::placeholder { color: #68746c; opacity: 1; }
.send {
  display: grid;
  width: 40px;
  height: 40px;
  flex: none;
  place-items: center;
  border: 0;
  border-radius: 11px;
  color: #fff;
  background: var(--evergreen);
  cursor: pointer;
  transition: background .18s ease, transform .18s ease, opacity .18s ease;
}
.send:hover { transform: translateY(-1px); background: var(--evergreen-deep); }
.send:disabled { opacity: .5; cursor: default; transform: none; }
.send svg { width: 17px; height: 17px; }
.footnote { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 9px 2px 0; color: #657269; font-size: 10px; line-height: 1.3; }
.footnote a { flex: none; color: #476d54; text-decoration: none; }
.footnote a:hover { text-decoration: underline; text-underline-offset: 2px; }
.demo-badge { display: none; color: #6f795f; font-size: 9px; font-weight: 700; letter-spacing: .08em; }
.launcher {
  position: relative;
  display: grid;
  width: 62px;
  height: 62px;
  place-items: center;
  border: 1px solid rgba(255, 255, 255, .38);
  border-radius: 20px;
  color: #fff;
  background: var(--evergreen);
  box-shadow: 0 10px 30px rgba(20, 54, 39, .2), inset 0 1px 0 rgba(255, 255, 255, .14);
  cursor: pointer;
  transition: transform .22s ease, box-shadow .22s ease, background .18s ease;
}
.launcher:hover { transform: translateY(-2px); background: #123f32; box-shadow: 0 14px 36px rgba(20, 54, 39, .24), inset 0 1px 0 rgba(255, 255, 255, .16); }
.launcher svg { width: 25px; height: 25px; }
.pulse { position: absolute; inset: -6px; border: 1px solid rgba(73, 112, 83, .31); border-radius: 24px; animation: launcher-pulse 3.2s ease-out infinite; pointer-events: none; }
@keyframes launcher-pulse { 0% { opacity: .48; transform: scale(.97); } 72%, 100% { opacity: 0; transform: scale(1.19); } }
.demo-badge { white-space: nowrap; }
:where(button, a, input):focus-visible { outline: 3px solid #8aab91; outline-offset: 3px; }
@media (max-width: 560px) {
  #dr-yun-chat { right: 14px; bottom: max(14px, env(safe-area-inset-bottom)); }
  .launcher { width: 58px; height: 58px; border-radius: 18px; }
  .pulse { border-radius: 23px; }
  .chat-panel {
    position: fixed;
    right: 10px;
    bottom: calc(78px + env(safe-area-inset-bottom));
    left: 10px;
    width: auto;
    height: min(660px, calc(100dvh - 98px - env(safe-area-inset-bottom)));
    min-height: min(390px, calc(100dvh - 98px - env(safe-area-inset-bottom)));
    max-height: calc(100dvh - 22px - env(safe-area-inset-top));
    border-radius: 22px;
    transform-origin: bottom center;
  }
  .chat-head { min-height: 96px; padding: 15px 16px; }
  .brand-icon { width: 44px; height: 44px; border-radius: 14px; }
  .brand-icon svg { width: 25px; height: 25px; }
  .brand-title { font-size: 19px; }
  .messages { padding: 17px 15px 9px; }
  .suggestion-area { padding: 0 14px 12px; }
  .suggestions { gap: 7px; }
  .suggestions button { width: 100%; min-height: 44px; padding: 9px 10px; font-size: 11px; }
  .composer { padding: 10px 13px max(11px, env(safe-area-inset-bottom)); }
  .input-wrap { height: 52px; }
  .send { width: 44px; height: 44px; }
  .close { width: 44px; height: 44px; }
}
@media (max-width: 375px) {
  #dr-yun-chat { right: 12px; }
  .chat-panel { right: 8px; left: 8px; }
  .chat-head { gap: 10px; padding-inline: 13px; }
  .brand-title { font-size: 18px; }
  .brand-subtitle { font-size: 10px; }
  .close { width: 44px; height: 44px; }
  .messages { padding-inline: 12px; }
  .suggestion-area { padding-right: 11px; padding-left: 11px; }
  .suggestions button { font-size: 10px; }
  .footnote { font-size: 9px; }
}
@media (max-height: 520px) and (max-width: 800px) {
  .chat-panel { height: calc(100dvh - 90px); min-height: 0; }
  .chat-head { min-height: 78px; padding-block: 10px; }
  .brand-icon { width: 40px; height: 40px; }
  .eyebrow { white-space: nowrap; }
  .brand-title { font-size: 16px; white-space: nowrap; }
  .brand-subtitle { display: none; }
  .messages { padding-block: 11px 6px; }
  .day { margin-bottom: 11px; }
  .suggestion-area { padding: 0 12px 8px; }
  .suggestions { grid-template-columns: 1fr; gap: 6px; }
  .suggestions button { width: 100%; min-height: 44px; }
  .suggestions button:first-child { grid-column: auto; }
  .composer { padding-block: 8px; }
}
@media (max-height: 420px) and (max-width: 800px) {
  .suggestions {
    display: flex;
    align-items: center;
    gap: 7px;
    overflow-x: auto;
    padding: 0 12px 8px;
    scrollbar-width: none;
  }
  .suggestions::-webkit-scrollbar { display: none; }
  .suggestions button { width: max-content; min-height: 44px; flex: 0 0 auto; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}
</style>
</head>
<body>
<div id="dr-yun-chat">
  <button class="launcher" type="button" aria-label="Открыть чат" aria-expanded="true">
    <span class="pulse" aria-hidden="true"></span>
    <svg viewBox="0 0 32 32" fill="none" aria-hidden="true">
      <path d="M10 6.5c2 0 3.3 1.1 6 1.1s4-1.1 6-1.1c3.5 0 5.5 2.7 5.5 6.2 0 4.2-3 13.6-6.6 13.6-1.8 0-2.4-5.6-4.9-5.6s-3.1 5.6-4.9 5.6C7.5 26.3 4.5 16.9 4.5 12.7c0-3.5 2-6.2 5.5-6.2Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
      <path d="M11.5 13.5h9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
    </svg>
  </button>
  <section class="chat-panel open" role="dialog" aria-label="Чат с клиникой Dr.Yun" aria-hidden="false">
    <header class="chat-head">
      <div class="brand-icon">
        <svg viewBox="0 0 32 32" fill="none" aria-hidden="true">
          <path d="M10 6.5c2 0 3.3 1.1 6 1.1s4-1.1 6-1.1c3.5 0 5.5 2.7 5.5 6.2 0 4.2-3 13.6-6.6 13.6-1.8 0-2.4-5.6-4.9-5.6s-3.1 5.6-4.9 5.6C7.5 26.3 4.5 16.9 4.5 12.7c0-3.5 2-6.2 5.5-6.2Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
          <path d="M11.5 13.5h9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="brand-copy">
        <p class="eyebrow"><span class="status-dot" aria-hidden="true"></span><span>НА СВЯЗИ</span></p>
        <h2 class="brand-title">Администратор клиники</h2>
        <p class="brand-subtitle">Вопросы об услугах и записи</p>
      </div>
      <button class="close" type="button" aria-label="Закрыть чат">
        <svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="m5 5 10 10M15 5 5 15" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
    </header>
    <div class="messages" aria-live="polite">
      <div class="day">Добро пожаловать</div>
    </div>
    <div class="suggestion-area">
      <button class="suggestions-toggle" type="button" aria-expanded="true" aria-controls="quick-suggestions">
        <span>Быстрые запросы</span><span class="suggestions-chevron" aria-hidden="true">⌄</span>
      </button>
      <div class="suggestions" id="quick-suggestions">
        <button type="button" data-prompt="Хочу записаться на приём">Записаться на приём <span aria-hidden="true">↗</span></button>
        <button type="button" data-prompt="Подскажите стоимость услуги">Узнать стоимость</button>
        <button type="button" data-prompt="Хочу задать вопрос о лечении">Задать вопрос</button>
      </div>
    </div>
    <form class="composer">
      <div class="input-wrap">
        <input class="chat-input" type="text" maxlength="1200" autocomplete="off" placeholder="Напишите сообщение…" aria-label="Ваше сообщение">
        <button class="send" type="submit" aria-label="Отправить сообщение">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m21 3-7.4 18-3.9-7.7L2 9.4 21 3Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M9.7 13.3 21 3" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
        </button>
      </div>
      <div class="footnote"><span>Не заменяет консультацию врача</span><span class="demo-badge">ДЕМО</span></div>
    </form>
  </section>
</div>
<script>
(function(){
  "use strict";
  var CONFIG={
    webhookUrl:"https://fugudhustitif.beget.app/webhook/chat",
    demoMode:false, // set true to use sample replies without calling the clinic workflow
    openInitially:true // set false when embedding on the live website
  };
  var root=document.getElementById("dr-yun-chat");
  var panel=root.querySelector(".chat-panel");
  var launcher=root.querySelector(".launcher");
  var close=root.querySelector(".close");
  var form=root.querySelector(".composer");
  var input=root.querySelector(".chat-input");
  var sendButton=root.querySelector(".send");
  var messages=root.querySelector(".messages");
  var suggestions=root.querySelector(".suggestions");
  var suggestionsToggle=root.querySelector(".suggestions-toggle");
  var badge=root.querySelector(".demo-badge");
  var busy=false;

  function setSuggestionsOpen(value){
    suggestions.hidden=!value;
    suggestionsToggle.setAttribute("aria-expanded",value?"true":"false");
  }

  function makeId(prefix){
    var token=window.crypto&&window.crypto.randomUUID?window.crypto.randomUUID():(Date.now().toString(36)+Math.random().toString(36).slice(2));
    return prefix+token;
  }
  function persistentId(store,key,prefix){
    try{
      var id=store.getItem(key);
      if(!id){id=makeId(prefix);store.setItem(key,id);}
      return id;
    }catch(error){return makeId(prefix);}
  }
  var userId=persistentId(window.localStorage,"dryun_chat_user","visitor_");
  var chatId=persistentId(window.sessionStorage,"dryun_chat_session","chat_");

  function timeNow(){
    return new Intl.DateTimeFormat("ru-RU",{hour:"2-digit",minute:"2-digit"}).format(new Date());
  }
  function tooth(){
    return '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M8 4c1.4 0 2.3.8 4 .8s2.6-.8 4-.8c2.5 0 4 1.9 4 4.4 0 3-2.1 9.6-4.7 9.6-1.3 0-1.7-4-3.3-4s-2 4-3.3 4C6.1 18 4 11.4 4 8.4 4 5.9 5.5 4 8 4Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>';
  }
  function addMessage(role,text){
    var row=document.createElement("div");
    row.className="message "+role;
    if(role==="assistant"){
      var avatar=document.createElement("div");
      avatar.className="tooth";
      avatar.innerHTML=tooth();
      row.appendChild(avatar);
    }
    var stack=document.createElement("div");
    stack.className="stack";
    var bubble=document.createElement("div");
    bubble.className="bubble";
    bubble.textContent=text;
    var stamp=document.createElement("div");
    stamp.className="stamp";
    stamp.textContent=timeNow();
    stack.appendChild(bubble);
    stack.appendChild(stamp);
    row.appendChild(stack);
    messages.appendChild(row);
    messages.scrollTop=messages.scrollHeight;
  }
  function showTyping(){
    var row=document.createElement("div");
    row.className="typing";
    row.innerHTML='<div class="tooth">'+tooth()+'</div><div class="dots" aria-label="Печатает"><i></i><i></i><i></i></div>';
    messages.appendChild(row);
    messages.scrollTop=messages.scrollHeight;
    return row;
  }
  function demoReply(text){
    var value=text.toLowerCase();
    if(/запис|при[её]м|завтра|сегодня/.test(value))return "Конечно, помогу с записью. На какую услугу и в какой день вам удобно прийти?";
    if(/цен|стоим|сколько/.test(value))return "Подскажите, пожалуйста, какая услуга вас интересует? Проверю информацию в базе клиники.";
    return "Поняла вас. Расскажите чуть подробнее, что именно хотите уточнить — постараюсь помочь.";
  }
  async function getReply(text){
    if(CONFIG.demoMode){
      badge.style.display="inline";
      await new Promise(function(resolve){setTimeout(resolve,650);});
      return demoReply(text);
    }
    var response=await fetch(CONFIG.webhookUrl,{
      method:"POST",
      mode:"cors",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({chatInput:text,userId:userId,chatId:chatId}),
      credentials:"omit",
      cache:"no-store"
    });
    var body=await response.text();
    if(!response.ok)throw new Error("Webhook status "+response.status);
    if(!body.trim())return "Не удалось получить ответ. Попробуйте задать вопрос ещё раз.";
    try{
      var data=JSON.parse(body);
      if(data&&typeof data.output==="string")return data.output;
      if(data&&typeof data.text==="string")return data.text;
    }catch(error){return body;}
    return body;
  }
  async function send(text){
    var clean=String(text||"").trim();
    if(!clean||busy)return;
    addMessage("user",clean);
    setSuggestionsOpen(false);
    input.value="";
    busy=true;
    input.disabled=true;
    sendButton.disabled=true;
    var typing=showTyping();
    try{
      var reply=await getReply(clean);
      typing.remove();
      addMessage("assistant",reply);
    }catch(error){
      typing.remove();
      addMessage("assistant","Не удалось подключиться к чату. Проверьте доступность вебхука и настройки CORS для dr-yun.ru.");
    }finally{
      busy=false;
      input.disabled=false;
      sendButton.disabled=false;
      input.focus();
    }
  }
  function setOpen(value){
    root.classList.toggle("open",value);
    panel.classList.toggle("open",value);
    panel.setAttribute("aria-hidden",value?"false":"true");
    launcher.setAttribute("aria-expanded",value?"true":"false");
    launcher.setAttribute("aria-label",value?"Закрыть чат":"Открыть чат");
    if(value){
      setSuggestionsOpen(true);
      setTimeout(function(){input.focus();},180);
    }
  }
  launcher.addEventListener("click",function(){setOpen(!panel.classList.contains("open"));});
  close.addEventListener("click",function(){setOpen(false);});
  form.addEventListener("submit",function(event){event.preventDefault();send(input.value);});
  suggestionsToggle.addEventListener("click",function(){setSuggestionsOpen(suggestions.hidden);});
  root.querySelectorAll("[data-prompt]").forEach(function(button){
    button.addEventListener("click",function(){send(button.getAttribute("data-prompt"));});
  });
  addMessage("assistant","Здравствуйте! Я помогу разобраться с услугами клиники и записаться на приём. Что вас интересует?");
  setOpen(CONFIG.openInitially);
})();
</script>
</body>
</html>
